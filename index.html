*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#05050a;--text:#fff;--muted:#8b8b9e;--purple:#8b5cf6;--cyan:#22d3ee;--pink:#ec4899}
html,body{height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
body{min-height:100vh;padding:32px 16px 100px;display:flex;flex-direction:column;align-items:center;position:relative}

/* ===== خلفية ===== */
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7}
.bg-orbs{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 22s infinite ease-in-out}
.orb-1{width:520px;height:520px;background:#7c3aed;top:-220px;right:-120px}
.orb-2{width:420px;height:420px;background:#0891b2;bottom:-180px;left:-120px;animation-delay:-8s}
.orb-3{width:360px;height:360px;background:#ec4899;top:40%;left:50%;animation-delay:-15s;opacity:.25}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-50px) scale(1.1)}66%{transform:translate(-50px,60px) scale(.9)}}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%)}
.cursor-glow{position:fixed;width:600px;height:600px;border-radius:50%;pointer-events:none;
  z-index:-1;background:radial-gradient(circle,rgba(139,92,246,.18) 0%,transparent 70%);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .4s;will-change:transform}

/* ===== حاوية ===== */
.wrap{width:100%;max-width:470px;display:flex;flex-direction:column;gap:18px;z-index:1;position:relative}

/* ===== بطاقة الملف ===== */
.profile{position:relative;border-radius:30px;padding:36px 24px 28px;text-align:center;
  background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  overflow:hidden;animation:cardIn .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
.profile::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 0%,rgba(139,92,246,.25),transparent 55%)}
.profile::after{content:'';position:absolute;inset:0;border-radius:30px;padding:1.5px;pointer-events:none;
  background:linear-gradient(135deg,rgba(139,92,246,.6),transparent 45%,rgba(34,211,238,.6),transparent 80%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:6px 14px;border-radius:100px;margin-bottom:18px;position:relative;z-index:1;
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);color:#67e8f9}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.avatar-wrap{position:relative;width:118px;height:118px;margin:0 auto 18px;z-index:1}
.avatar-wrap::before,.avatar-wrap::after{content:'';position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,#8b5cf6,#22d3ee,#ec4899,#f59e0b,#8b5cf6);animation:spin 5s linear infinite}
.avatar-wrap::after{filter:blur(18px);opacity:.7;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:4px solid #0a0a14;background:#0a0a14;z-index:1;display:block}
.verified{position:absolute;bottom:4px;left:4px;width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#22d3ee,#3b82f6);display:grid;place-items:center;
  font-size:12px;color:#fff;border:3px solid #0a0a14;z-index:2;box-shadow:0 0 14px rgba(34,211,238,.6)}
.name{font-size:27px;font-weight:900;letter-spacing:-.6px;margin-bottom:4px;position:relative;z-index:1;
  background:linear-gradient(135deg,#fff 20%,#a78bfa 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.handle{font-size:14px;color:var(--muted);margin-bottom:14px;position:relative;z-index:1}
.bio{font-size:13.5px;line-height:1.75;color:#b9b9cb;position:relative;z-index:1;padding:0 6px}

/* ===== السوشيال ===== */
.socials{display:flex;flex-direction:column;gap:11px}
.social{position:relative;display:flex;align-items:center;gap:14px;padding:13px 14px;

  transition:all .4s cubic-bezier(.2,.9,.3,1);overflow:hidden;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transform:translateY(20px);animation:slideIn .6s cubic-bezier(.2,.9,.3,1) forwards}
.social:nth-child(1){animation-delay:.15s}.social:nth-child(2){animation-delay:.22s}
.social:nth-child(3){animation-delay:.29s}.social:nth-child(4){animation-delay:.36s}
.social:nth-child(5){animation-delay:.43s}.social:nth-child(6){animation-delay:.50s}
.social:nth-child(7){animation-delay:.57s}.social:nth-child(8){animation-delay:.64s}
.social:nth-child(9){animation-delay:.71s}.social:nth-child(10){animation-delay:.78s}
@keyframes slideIn{to{opacity:1;transform:none}}
.social::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .4s;z-index:0;background:linear-gradient(135deg,var(--c1),var(--c2))}
.social:hover::before{opacity:.18}
.social:hover{transform:translateY(-3px) scale(1.015);border-color:var(--c1);box-shadow:0 14px 40px -14px var(--c1)}
.social>*{position:relative;z-index:1}
.s-icon{width:46px;height:46px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;

.s-info{flex:1;display:flex;flex-direction:column;gap:1px;text-align:right;min-width:0}

.s-copy:hover{background:var(--c1);color:#fff;border-color:transparent;transform:scale(1.1)}

/* ===== أزرار ===== */

/* ===== Toast ===== */

/* ===== زر الموسيقى العائم ===== */
.music-btn{position:fixed;bottom:24px;left:24px;width:56px;height:56px;border-radius:50%;

.music-btn:active{transform:scale(.95)}
.music-btn.playing{animation:musicPulse 2s ease-in-out infinite}
@keyframes musicPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.55),0 8px 24px -8px rgba(139,92,246,.8)}

@media(max-width:420px){

  .avatar-wrap{width:104px;height:104px}

  .s-icon{width:42px;height:42px;font-size:19px}
  .music-btn{width:50px;height:50px;font-size:17px;bottom:18px;left:18px}
  body{padding-bottom:90px}
}
@media(hover:none){.cursor-glow{display:none}}

<script>
/* ===== جزيئات ===== */
const cv=document.getElementById('particles'),ctx=cv.getContext('2d');
let W,H,parts=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
size();addEventListener('resize',size);
const COUNT=innerWidth<600?40:70;
for(let i=0;i<COUNT;i++)parts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.4});
function loop(){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);
    ctx.fillStyle='rgba(139,92,246,.55)';ctx.fill();
  }
  for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){
    const dx=parts[i].x-parts[j].x,dy=parts[i].y-parts[j].y,d=Math.hypot(dx,dy);
    if(d<120){
      ctx.beginPath();ctx.moveTo(parts[i].x,parts[i].y);ctx.lineTo(parts[j].x,parts[j].y);
      ctx.strokeStyle=`rgba(139,92,246,${.15*(1-d/120)})`;ctx.lineWidth=.5;ctx.stroke();
    }
  }
  requestAnimationFrame(loop);
}
loop();

/* ===== توهج المؤشر ===== */
const glow=document.getElementById('cursorGlow');
let mx=0,my=0,gx=0,gy=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;glow.style.opacity='1';});
(function animGlow(){gx+=(mx-gx)*.12;gy+=(my-gy)*.12;glow.style.transform=`translate(${gx-300}px,${gy-300}px)`;requestAnimationFrame(animGlow);})();

/* ===== نسخ ===== */
function copy(txt,label){
  const done=()=>showToast(`تم نسخ ${label} ✓`);
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){showToast('تعذّر النسخ');}
    document.body.removeChild(ta);
  }
}
document.querySelectorAll('.s-copy').forEach(b=>{
  b.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();
    copy(b.dataset.copy,b.dataset.label||'النص');
  });
});

/* ===== Toast ===== */
let tTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.querySelector('span').textContent=msg;
  t.classList.add('show');
  clearTimeout(tTimer);
  tTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ===== مشاركة ===== */
document.getElementById('shareBtn').addEventListener('click',async()=>{
  const data={title:'بطاقتي الرقمية',text:'تواصل معي عبر جميع منصاتي ✨',url:location.href};
  if(navigator.share){try{await navigator.share(data);}catch(e){}}
  else{copy(location.href,'الرابط');}
});

/* ===== QR ===== */
const qrModal=document.getElementById('qrModal');
document.getElementById('qrBtn').addEventListener('click',()=>{
  document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&color=0a0a12&bgcolor=ffffff&data=${encodeURIComponent(location.href)}`;
  qrModal.classList.add('open');
});
document.getElementById('closeQr').addEventListener('click',()=>qrModal.classList.remove('open'));
qrModal.addEventListener('click',e=>{if(e.target===qrModal)qrModal.classList.remove('open');});

/* ===== ضغط مطوّل للنسخ ===== */
document.querySelectorAll('.social').forEach(card=>{
  let timer;
  card.addEventListener('touchstart',()=>{
    timer=setTimeout(()=>{
      const handle=card.querySelector('.s-handle').textContent;
      copy(handle,'الحساب');
      if(navigator.vibrate)navigator.vibrate(30);
    },600);
  },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>card.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));
});

/* ===== 🎵 الموسيقى ===== */
(function initMusic(){
  const music = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');
  music.volume = 0.35;
  let playing = false;

  function updateIcon(){
    btn.innerHTML = playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-music"></i>';
    btn.classList.toggle('playing', playing);
  }

  async function tryPlay(){
    try{
      await music.play();
      playing = true;
      updateIcon();
      btn.classList.remove('attention');
      return true;
    }catch(e){ return false; }
  }

  function stop(){
    music.pause();
    playing = false;
    updateIcon();
    btn.classList.remove('attention');
  }

  btn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(playing){ stop(); }
    else{ await tryPlay(); }
  });

  window.addEventListener('load', async ()=>{
    const ok = await tryPlay();
    if(ok) return;

    btn.classList.add('attention');
    const start = async ()=>{
      const played = await tryPlay();
      if(played){
        document.removeEventListener('click', start);
        document.removeEventListener('touchstart', start);
        document.removeEventListener('keydown', start);
      }
    };
    document.addEventListener('click', start);
    document.addEventListener('touchstart', start, {passive:true});
    document.addEventListener('keydown', start);
  });

  music.addEventListener('error', ()=>console.warn('⚠️ تعذّر تحميل ملف الموسيقى، تأكد من الرابط.'));

  updateIcon();
})();
</script>
